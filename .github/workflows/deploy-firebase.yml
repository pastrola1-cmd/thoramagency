name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js static export
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_FIREBASE_API_KEY: "mock-api-key-value-12345"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "thoramgroup-f2e76.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "thoramgroup-f2e76"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "thoramgroup-f2e76.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:1234567890abcdef"
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: "pk_test_mockpaystackkey1234567890"
          NEXT_PUBLIC_SUPABASE_URL: "https://cvhopmfoklijshhlmcbi.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2aG9wbWZva2xpanNoaGxtY2JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQxODksImV4cCI6MjA5OTIwMDE4OX0.CKMU6Ha7DoI9CqiSfpTSy3Bq55x-VUzfhc3NH-HkbfM"
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN || secrets.IREBASE_TOKEN }}
        run: npx firebase-tools deploy --only hosting --project thoramgroup-f2e76 --non-interactive
